analysis:
  weights:
    macro: 0.15
    quant: 0.40
    whale: 0.10
    fundamental: 0.25
    sentiment: 0.10

risk:
  kelly:
    max_fraction: 0.25
    min_fraction: 0.01
  min_risk_reward_ratio: 3.0   # ESKİ: 2.5 → YENİ: 3.0
  atr:
    stop_loss_multiplier: 1.0
    take_profit_multiplier: 3.0

ceo:
  max_score_spread: 1.10
  long_threshold: 0.15
  short_threshold: -0.15
  min_composite_score: 0.65   # ESKİ: 0.52 → YENİ: 0.65 (düşük kaliteli sinyalleri bastır)
  confidence_threshold: 0.60  # ESKİ: 0.50 → YENİ: 0.60
  confidence_boost: 0.25
  max_retries: 1
  # TF uyum zorunluluğu: en az bu kadar TF aynı yönde olmadan sinyal üretilmez
  min_aligned_timeframes: 3

red_team:
  black_swan_spread: 1.20
  min_llm_confidence: 0.55
  fail_on_fatal: true

quant:
  timeframe: "4h"
  ohlcv_limit: 200
  rsi_period: 14
  ma_fast_period: 9
  ma_slow_period: 21
  fib_lookback_bars: 60
  atr_period: 14
  fib_proximity_threshold_pct: 1.5
  score:
    rsi_oversold_bonus: 12.0
    rsi_overbought_penalty: 12.0
    rsi_bullish_zone_bonus: 5.0
    rsi_bearish_zone_penalty: 5.0
    cross_golden_bonus: 18.0
    cross_bullish_bonus: 8.0
    cross_bearish_penalty: 8.0
    cross_death_penalty: 18.0
    divergence_bullish_bonus: 14.0
    divergence_bearish_penalty: 14.0
    fib_proximity_bonus: 8.0
    atr_rr_bonus: 6.0
    atr_rr_penalty: 6.0
    atr_rr_high_threshold: 2.0
    atr_rr_low_threshold: 1.0

whale:
  timeframe: "1h"
  ohlcv_limit: 240
  sweep_lookback_bars: 36
  cvd_lookback_bars: 48
  wick_ratio_threshold: 0.55
  body_ratio_threshold: 0.25
  rr_target_multiplier: 2.2
  whale_ssl_blocked_fallback: "cvd_only"

llm:
  model: "openai/gpt-4.1-mini"
  temperature: 0.0
  timeout_seconds: 18
  max_retries: 1
  base_url_env: "OPENROUTER_BASE_URL"
  api_key_env: "OPENROUTER_API_KEY"

asset_universe:
  crypto:
    - "BTC/USDT"
    - "ETH/USDT"
    - "INJ/USDT"
    - "RNDR/USDT"
    - "FET/USDT"
  us_stocks:
    - "NVDA"
    - "TSLA"
    - "MSTR"
    - "COIN"
    - "INTC"
    - "AMD"
    - "AMAT"
    - "SPY"
  bist:
    - "ASTOR.IS"
    - "EUPWR.IS"
    - "THYAO.IS"
    - "GARAN.IS"
    - "EREGL.IS"
  commodities:
    - "GC=F"
    - "SI=F"
    - "CL=F"

bist:
  # TCMB politika faizi (manuel güncelleme)
  tcmb_rate: 46.0
  # USDTRY %2 haftalık artış = ağır bearish context eşiği
  usdtry_bearish_threshold_pct: 2.0

# Sinyal kalite filtresi
signal_quality:
  # Haftalık bearish iken günlük oversold bounce = SHORT_TERM_BOUNCE_ONLY (tam AL sinyali değil)
  htf_conflict_forces_bounce_label: true
  # Formation skoru bu değerin üzerindeyse SIGNAL FORMING bildirimi gönderilir
  formation_notify_threshold: 60
  # Sinyal üretimi için zorunlu minimum timeframe uyum sayısı (4 TF içinden)
  min_tf_alignment_for_signal: 3

scan_schedule:
  full_scan_interval_hours: 4
  watchlist_check_interval_min: 15
  daily_briefing_hour: 8
  # ── PROJECT OLYMPUS V2: Gece taraması (04:00-09:00) + katmanlı pipeline ──
  overnight_start_hour: 4
  overnight_end_hour: 9
  delivery_hour: 9
  prefilter_concurrency: 3
  deep_scan_max_assets: 6
  per_asset_timeout_sec: 300
  scan_wallclock_timeout_min: 240
  heartbeat_interval_min: 10
  tf_window: ["5m", "15m", "1h", "4h", "1d", "1w"]

higher_timeframe_filter:
  enabled: true
  block_long_if_weekly_bearish: true
  downgrade_long_if_daily_bearish: true
  require_full_alignment_for_strong_buy: true
